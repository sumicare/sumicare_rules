- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app.kubernetes.io/component: webhooks
      app.kubernetes.io/instance: keda-operator
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: keda-operator
      app.kubernetes.io/part-of: keda-operator
      app.kubernetes.io/version: 2.20.2
    name: keda-admission-webhooks
    namespace: keda
  spec:
    minReadySeconds: 0
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        cdk8s.io/metadata.addr: keda-deployments-webhooks-deployment-c8f49a6c
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        labels:
          app.kubernetes.io/component: webhooks
          app.kubernetes.io/instance: keda-operator
          app.kubernetes.io/name: keda-operator
          cdk8s.io/metadata.addr: keda-deployments-webhooks-deployment-c8f49a6c
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: eks.amazonaws.com/compute-type
                      operator: NotIn
                      values:
                        - fargate
                        - auto
                    - key: cloud.google.com/compute-class
                      operator: DoesNotExist
                    - key: kubernetes.azure.com/cluster-autoscaler-mode
                      operator: NotIn
                      values:
                        - automatic
                    - key: cloud.google.com/gke-spot
                      operator: NotIn
                      values:
                        - "true"
                    - key: kubernetes.azure.com/scalesetpriority
                      operator: NotIn
                      values:
                        - spot
                    - key: lifecycle
                      operator: NotIn
                      values:
                        - Spot
                        - spot
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cdk8s.io/metadata.addr: keda-deployments-webhooks-deployment-c8f49a6c
                  namespaces:
                    - keda
                  topologyKey: kubernetes.io/hostname
                weight: 100
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cdk8s.io/metadata.addr: keda-deployments-webhooks-deployment-c8f49a6c
                  namespaces:
                    - keda
                  topologyKey: topology.kubernetes.io/zone
                weight: 50
        automountServiceAccountToken: true
        containers:
          - args:
              - --zap-log-level=info
              - --zap-encoder=console
              - --zap-time-encoding=rfc3339
              - --cert-dir=/certs
              - --health-probe-bind-address=:8081
              - --port=9443
              - --metrics-bind-address=:8080
            command:
              - /keda-admission-webhooks
            env:
              - name: WATCH_NAMESPACE
                value: ""
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            image: ghcr.io/kedacore/keda-admission-webhooks:2.20.2
            imagePullPolicy: IfNotPresent
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /healthz
                port: 8081
                scheme: HTTP
              initialDelaySeconds: 10
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 5
            name: keda-admission-webhooks
            ports:
              - containerPort: 9443
                name: http
                protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /readyz
                port: 8081
                scheme: HTTP
              initialDelaySeconds: 10
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 5
            resources:
              limits:
                cpu: 100m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - mountPath: /certs
                name: certificates
                readOnly: true
        dnsPolicy: ClusterFirst
        hostNetwork: false
        restartPolicy: Always
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: Always
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        serviceAccountName: keda-operator-webhooks
        setHostnameAsFQDN: false
        shareProcessNamespace: false
        terminationGracePeriodSeconds: 30
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: webhooks
                app.kubernetes.io/instance: keda-operator
                app.kubernetes.io/name: keda-operator
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: webhooks
                app.kubernetes.io/instance: keda-operator
                app.kubernetes.io/name: keda-operator
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
        volumes:
          - name: certificates
            secret:
              secretName: kedaorg-certs
