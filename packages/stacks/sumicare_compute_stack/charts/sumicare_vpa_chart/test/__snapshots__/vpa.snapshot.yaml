- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app.kubernetes.io/component: admission-controller
      app.kubernetes.io/instance: vpa
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: vpa
      app.kubernetes.io/part-of: vpa
      app.kubernetes.io/version: 1.7.1
    name: vpa-admission-controller
    namespace: kube-system
  spec:
    minReadySeconds: 0
    progressDeadlineSeconds: 600
    replicas: 2
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        cdk8s.io/metadata.addr: vpa-deployments-admission-controller-deployment-c87a98d3
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        labels:
          app.kubernetes.io/component: admission-controller
          app.kubernetes.io/instance: vpa
          app.kubernetes.io/name: vpa
          cdk8s.io/metadata.addr: vpa-deployments-admission-controller-deployment-c87a98d3
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: eks.amazonaws.com/compute-type
                      operator: NotIn
                      values:
                        - fargate
                        - auto
                    - key: cloud.google.com/compute-class
                      operator: DoesNotExist
                    - key: kubernetes.azure.com/cluster-autoscaler-mode
                      operator: NotIn
                      values:
                        - automatic
                    - key: cloud.google.com/gke-spot
                      operator: NotIn
                      values:
                        - "true"
                    - key: kubernetes.azure.com/scalesetpriority
                      operator: NotIn
                      values:
                        - spot
                    - key: lifecycle
                      operator: NotIn
                      values:
                        - Spot
                        - spot
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cdk8s.io/metadata.addr: vpa-deployments-admission-controller-deployment-c87a98d3
                  namespaces:
                    - kube-system
                  topologyKey: kubernetes.io/hostname
                weight: 100
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cdk8s.io/metadata.addr: vpa-deployments-admission-controller-deployment-c87a98d3
                  namespaces:
                    - kube-system
                  topologyKey: topology.kubernetes.io/zone
                weight: 50
        automountServiceAccountToken: true
        containers:
          - args:
              - --v=4
              - --stderrthreshold=info
              - --webhook-service=vpa-webhook
              - --port=8000
              - --reload-cert=true
            env:
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            image: registry.k8s.io/autoscaling/vpa-admission-controller:1.7.1
            imagePullPolicy: IfNotPresent
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /health-check
                port: 8944
                scheme: HTTP
              initialDelaySeconds: 10
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 5
            name: admission-controller
            ports:
              - containerPort: 8000
                name: http
                protocol: TCP
              - containerPort: 8944
                name: metrics
                protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health-check
                port: 8944
                scheme: HTTP
              initialDelaySeconds: 10
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 5
            resources:
              limits:
                cpu: 100m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - mountPath: /etc/tls-certs
                name: tls-certs
                readOnly: true
        dnsPolicy: ClusterFirst
        hostNetwork: false
        restartPolicy: Always
        securityContext:
          fsGroup: 65534
          fsGroupChangePolicy: Always
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        serviceAccountName: vpa-admission-controller
        setHostnameAsFQDN: false
        shareProcessNamespace: false
        terminationGracePeriodSeconds: 30
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: admission-controller
                app.kubernetes.io/instance: vpa
                app.kubernetes.io/name: vpa
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: admission-controller
                app.kubernetes.io/instance: vpa
                app.kubernetes.io/name: vpa
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
        volumes:
          - name: tls-certs
            secret:
              secretName: vpa-tls-secret
