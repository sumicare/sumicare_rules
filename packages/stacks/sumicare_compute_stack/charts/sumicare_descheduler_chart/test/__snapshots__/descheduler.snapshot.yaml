    externalIPs: []
    ipFamilies:
      - IPv4
      - IPv6
    ipFamilyPolicy: PreferDualStack
    ports:
      - name: https-metrics
        port: 10258
        protocol: TCP
        targetPort: 10258
    selector:
      app.kubernetes.io/instance: descheduler
      app.kubernetes.io/name: descheduler
    type: ClusterIP
- apiVersion: v1
  automountServiceAccountToken: false
  kind: ServiceAccount
  metadata:
    labels:
      app.kubernetes.io/component: descheduler
      app.kubernetes.io/instance: descheduler
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: descheduler
      app.kubernetes.io/part-of: descheduler
      app.kubernetes.io/version: 0.36.0
    name: descheduler
    namespace: kube-system
- apiVersion: monitoring.coreos.com/v1
  kind: ServiceMonitor
  metadata:
    labels:
      app.kubernetes.io/instance: descheduler
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: descheduler
      app.kubernetes.io/part-of: descheduler
      app.kubernetes.io/version: 0.36.0
    name: descheduler-servicemonitor
    namespace: kube-system
  spec:
    endpoints:
      - honorLabels: true
        interval: 30s
        metricRelabelings:
          - action: keep
            regex: descheduler|scheduler_|process_|go_|otel
            sourceLabels:
              - __name__
        port: metrics
        relabelings:
          - action: replace
            regex: ^(.*)$
            replacement: $1
            separator: ;
            sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: nodename
          - action: replace
            replacement: descheduler
            targetLabel: otel_service_name
          - action: replace
            replacement: kube-system
            targetLabel: otel_service_namespace
        scheme: https
    jobLabel: jobLabel
    namespaceSelector:
      matchNames:
        - kube-system
    selector:
      matchLabels:
        app.kubernetes.io/instance: descheduler
        app.kubernetes.io/name: descheduler
    targetLabels:
      - otel.service.name/descheduler
      - otel.service.namespace/kube-system
