- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app.kubernetes.io/component: console
      app.kubernetes.io/instance: kamaji-console
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: kamaji-console
      app.kubernetes.io/part-of: kamaji-console
      app.kubernetes.io/version: 0.2.1
    name: kamaji-console
    namespace: kamaji-system
  spec:
    minReadySeconds: 0
    progressDeadlineSeconds: 600
    replicas: 2
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        cdk8s.io/metadata.addr: kamaji-console-deployment-console-deployment-c872fa5c
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        labels:
          app.kubernetes.io/component: console
          app.kubernetes.io/instance: kamaji-console
          app.kubernetes.io/name: kamaji-console
          cdk8s.io/metadata.addr: kamaji-console-deployment-console-deployment-c872fa5c
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: eks.amazonaws.com/compute-type
                      operator: NotIn
                      values:
                        - fargate
                        - auto
                    - key: cloud.google.com/compute-class
                      operator: DoesNotExist
                    - key: kubernetes.azure.com/cluster-autoscaler-mode
                      operator: NotIn
                      values:
                        - automatic
                    - key: cloud.google.com/gke-spot
                      operator: NotIn
                      values:
                        - "true"
                    - key: kubernetes.azure.com/scalesetpriority
                      operator: NotIn
                      values:
                        - spot
                    - key: lifecycle
                      operator: NotIn
                      values:
                        - Spot
                        - spot
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cdk8s.io/metadata.addr: kamaji-console-deployment-console-deployment-c872fa5c
                  namespaces:
                    - kamaji-system
                  topologyKey: kubernetes.io/hostname
                weight: 100
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cdk8s.io/metadata.addr: kamaji-console-deployment-console-deployment-c872fa5c
                  namespaces:
                    - kamaji-system
                  topologyKey: topology.kubernetes.io/zone
                weight: 50
        automountServiceAccountToken: true
        containers:
          - envFrom:
              - secretRef:
                  name: kamaji-console
            image: ghcr.io/clastix/kamaji-console
            imagePullPolicy: Always
            name: kamaji-console
            ports:
              - containerPort: 3000
                name: http
                protocol: TCP
            resources:
              limits:
                cpu: 400m
                memory: 1024Mi
              requests:
                cpu: 200m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile:
                type: RuntimeDefault
        dnsPolicy: ClusterFirst
        hostNetwork: false
        restartPolicy: Always
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: Always
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
          seccompProfile:
            type: RuntimeDefault
        serviceAccountName: kamaji-console-console
        setHostnameAsFQDN: false
        shareProcessNamespace: false
        terminationGracePeriodSeconds: 30
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: console
                app.kubernetes.io/instance: kamaji-console
                app.kubernetes.io/name: kamaji-console
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: console
                app.kubernetes.io/instance: kamaji-console
                app.kubernetes.io/name: kamaji-console
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      app.kubernetes.io/component: console
      app.kubernetes.io/instance: kamaji-console
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: kamaji-console
      app.kubernetes.io/part-of: kamaji-console
      app.kubernetes.io/version: 0.2.1
    name: kamaji-console
    namespace: kamaji-system
  spec:
    externalIPs: []
    ipFamilies:
      - IPv4
      - IPv6
    ipFamilyPolicy: PreferDualStack
    ports:
      - name: http
        port: 80
        protocol: TCP
        targetPort: 3000
    selector:
      app.kubernetes.io/component: console
      app.kubernetes.io/instance: kamaji-console
      app.kubernetes.io/name: kamaji-console
    type: ClusterIP
- apiVersion: v1
  automountServiceAccountToken: false
  kind: ServiceAccount
  metadata:
    labels:
      app.kubernetes.io/component: console
      app.kubernetes.io/instance: kamaji-console
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: kamaji-console
