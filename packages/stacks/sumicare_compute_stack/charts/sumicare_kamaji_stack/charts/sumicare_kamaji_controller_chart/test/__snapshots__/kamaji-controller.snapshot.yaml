- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: kamaji
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: kamaji
      app.kubernetes.io/part-of: kamaji
      app.kubernetes.io/version: 26.7.5-edge
    name: kamaji
    namespace: kamaji-system
  spec:
    minReadySeconds: 0
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        cdk8s.io/metadata.addr: kamaji-controller-deployment-controller-deployment-c82fc8e3
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        labels:
          app.kubernetes.io/component: controller
          app.kubernetes.io/instance: kamaji
          app.kubernetes.io/name: kamaji
          cdk8s.io/metadata.addr: kamaji-controller-deployment-controller-deployment-c82fc8e3
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: eks.amazonaws.com/compute-type
                      operator: NotIn
                      values:
                        - fargate
                        - auto
                    - key: cloud.google.com/compute-class
                      operator: DoesNotExist
                    - key: kubernetes.azure.com/cluster-autoscaler-mode
                      operator: NotIn
                      values:
                        - automatic
                    - key: cloud.google.com/gke-spot
                      operator: NotIn
                      values:
                        - "true"
                    - key: kubernetes.azure.com/scalesetpriority
                      operator: NotIn
                      values:
                        - spot
                    - key: lifecycle
                      operator: NotIn
                      values:
                        - Spot
                        - spot
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cdk8s.io/metadata.addr: kamaji-controller-deployment-controller-deployment-c82fc8e3
                  namespaces:
                    - kamaji-system
                  topologyKey: kubernetes.io/hostname
                weight: 100
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cdk8s.io/metadata.addr: kamaji-controller-deployment-controller-deployment-c82fc8e3
                  namespaces:
                    - kamaji-system
                  topologyKey: topology.kubernetes.io/zone
                weight: 50
        automountServiceAccountToken: true
        containers:
          - args:
              - manager
              - --metrics-bind-address=:8080
              - --health-probe-bind-address=:8081
              - --leader-elect
              - --tmp-directory=/tmp/kamaji
              - --kine-image=rancher/kine:v0.11.10-amd64
              - --max-concurrent-tcp-reconciles=1
              - --controller-reconcile-timeout=30s
              - --cache-resync-period=10h
              - --certificate-expiration-deadline=24h
              - --webhook-service-name=kamaji-webhook-service
              - --webhook-ca-path=/tmp/k8s-webhook-server/serving-certs/ca.crt
              - --datastore=default
            command:
              - /kamaji
            env:
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: SERVICE_ACCOUNT
                valueFrom:
                  fieldRef:
                    fieldPath: spec.serviceAccountName
            image: clastix/kamaji:26.7.5-edge
            imagePullPolicy: Always
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /healthz
                port: 8081
                scheme: HTTP
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
            name: manager
            ports:
              - containerPort: 9443
                name: webhook-server
                protocol: TCP
              - containerPort: 8080
                name: metrics
                protocol: TCP
              - containerPort: 8081
                name: healthcheck
                protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /readyz
                port: 8081
                scheme: HTTP
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
            resources:
              limits:
                cpu: 400m
                memory: 1024Mi
              requests:
                cpu: 200m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - mountPath: /tmp
                name: tmp
              - mountPath: /tmp/k8s-webhook-server/serving-certs
                name: cert
                readOnly: true
        dnsPolicy: ClusterFirst
        hostNetwork: false
        restartPolicy: Always
        securityContext:
          fsGroup: 65532
          fsGroupChangePolicy: Always
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        serviceAccountName: kamaji
        setHostnameAsFQDN: false
        shareProcessNamespace: false
        terminationGracePeriodSeconds: 10
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: controller
                app.kubernetes.io/instance: kamaji
                app.kubernetes.io/name: kamaji
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: controller
                app.kubernetes.io/instance: kamaji
                app.kubernetes.io/name: kamaji
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
        volumes:
          - emptyDir:
              medium: Memory
            name: tmp
          - name: cert
            secret:
              secretName: kamaji-webhook-server-cert
