- apiVersion: apps/v1
  kind: StatefulSet
  metadata:
    labels:
      app.kubernetes.io/component: etcd
      app.kubernetes.io/instance: kamaji-etcd
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: kamaji-etcd
      app.kubernetes.io/part-of: kamaji-etcd
      app.kubernetes.io/version: 3.7.1
    name: etcd
    namespace: kamaji-system
  spec:
    minReadySeconds: 0
    podManagementPolicy: OrderedReady
    replicas: 3
    selector:
      matchLabels:
        cdk8s.io/metadata.addr: kamaji-etcd-statefulset-etcd-statefulset-c896a146
