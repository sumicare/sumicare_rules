          "etcd-1.etcd.kamaji-system.svc.cluster.local",
          "etcd-2.etcd.kamaji-system.svc.cluster.local",
          "etcd-0.etcd",
          "etcd-1.etcd",
          "etcd-2.etcd"
        ],
        "names": [
          {
