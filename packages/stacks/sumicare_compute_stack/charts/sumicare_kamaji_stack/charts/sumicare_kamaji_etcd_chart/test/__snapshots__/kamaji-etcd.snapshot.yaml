- apiVersion: batch/v1
  kind: Job
  metadata:
    labels:
      app.kubernetes.io/component: etcd
      app.kubernetes.io/instance: kamaji-etcd
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: kamaji-etcd
      app.kubernetes.io/part-of: kamaji-etcd
      app.kubernetes.io/version: 3.7.1
    name: etcd-certs
    namespace: kamaji-system
  spec:
    template:
      metadata:
        labels:
          app.kubernetes.io/component: etcd
          app.kubernetes.io/instance: kamaji-etcd
          app.kubernetes.io/managed-by: sumicare_rules
          app.kubernetes.io/name: kamaji-etcd
          app.kubernetes.io/part-of: kamaji-etcd
          app.kubernetes.io/version: 3.7.1
        name: etcd-certs
      spec:
        containers:
          - args:
              - if kubectl get secret etcd-certs --namespace=kamaji-system
                &>/dev/null; then echo "Secret etcd-certs already exists"; else
                echo "Creating secret etcd-certs"; kubectl
                --namespace=kamaji-system create secret generic etcd-certs
                --from-file=/certs/ca.crt --from-file=/certs/ca.key
                --from-file=/certs/peer-key.pem --from-file=/certs/peer.pem
                --from-file=/certs/server-key.pem --from-file=/certs/server.pem;
                fi && if kubectl get secret root-client-certs
                --namespace=kamaji-system &>/dev/null; then echo "Secret
                root-client-certs already exists"; else echo "Creating secret
                root-client-certs"; kubectl --namespace=kamaji-system create
                secret tls root-client-certs --key=/certs/root-client-key.pem
                --cert=/certs/root-client.pem; fi
            command:
              - /bin/sh
              - -c
            image: clastix/kubectl:v1.35
            name: kubectl
            volumeMounts:
              - mountPath: /certs
                name: certs
        initContainers:
          - args:
              - cfssl gencert -initca /csr/ca-csr.json | cfssljson -bare
                /certs/ca && mv /certs/ca.pem /certs/ca.crt && mv
                /certs/ca-key.pem /certs/ca.key && cfssl gencert
                -ca=/certs/ca.crt -ca-key=/certs/ca.key -config=/csr/config.json
                -profile=peer-authentication /csr/peer-csr.json | cfssljson
                -bare /certs/peer && cfssl gencert -ca=/certs/ca.crt
                -ca-key=/certs/ca.key -config=/csr/config.json
                -profile=peer-authentication /csr/server-csr.json | cfssljson
                -bare /certs/server && cfssl gencert -ca=/certs/ca.crt
                -ca-key=/certs/ca.key -config=/csr/config.json
                -profile=client-authentication /csr/root-client-csr.json |
                cfssljson -bare /certs/root-client
            command:
              - bash
              - -c
            image: cfssl/cfssl:latest
            name: cfssl
            volumeMounts:
              - mountPath: /certs
                name: certs
              - mountPath: /csr
                name: csr
        restartPolicy: Never
        securityContext:
          fsGroup: 1000
          runAsGroup: 1000
          runAsUser: 1000
        serviceAccountName: kamaji-etcd-etcd
        volumes:
          - configMap:
              name: etcd-csr
            name: csr
          - emptyDir: {}
            name: certs
- apiVersion: batch/v1
  kind: Job
  metadata:
    labels:
      app.kubernetes.io/component: etcd
      app.kubernetes.io/instance: kamaji-etcd
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: kamaji-etcd
      app.kubernetes.io/part-of: kamaji-etcd
      app.kubernetes.io/version: 3.7.1
    name: etcd-setup
    namespace: kamaji-system
  spec:
    template:
      metadata:
        labels:
          app.kubernetes.io/component: etcd
          app.kubernetes.io/instance: kamaji-etcd
          app.kubernetes.io/managed-by: sumicare_rules
          app.kubernetes.io/name: kamaji-etcd
          app.kubernetes.io/part-of: kamaji-etcd
          app.kubernetes.io/version: 3.7.1
        name: etcd-setup
      spec:
        containers:
          - args:
              - |-
                etcdctl member list -w table
                if etcdctl user get root &>/dev/null; then
                  echo "User already exists, nothing to do"
                else
                  etcdctl user add --no-password=true root &&
                  etcdctl role add root &&
                  etcdctl user grant-role root root &&
                  etcdctl auth enable
                fi
            command:
              - bash
              - -c
            env:
              - name: ETCDCTL_ENDPOINTS
                value: https://etcd-0.etcd.kamaji-system.svc.cluster.local:2379
              - name: ETCDCTL_CACERT
                value: /opt/certs/ca/ca.crt
              - name: ETCDCTL_CERT
                value: /opt/certs/root-certs/tls.crt
              - name: ETCDCTL_KEY
                value: /opt/certs/root-certs/tls.key
            image: quay.io/coreos/etcd:v3.5.1
            imagePullPolicy: Always
            name: etcd-client
            volumeMounts:
              - mountPath: /opt/certs/root-certs
                name: root-certs
              - mountPath: /opt/certs/ca
                name: certs
        initContainers:
          - command:
              - sh
              - -c
              - kubectl --namespace=kamaji-system rollout status sts/etcd
                --timeout=300s
            image: clastix/kubectl:v1.35
            name: kubectl
        restartPolicy: Never
        securityContext:
          fsGroup: 1000
          runAsGroup: 1000
          runAsUser: 1000
        serviceAccountName: kamaji-etcd-etcd
        volumes:
          - name: root-certs
            secret:
              secretName: root-client-certs
          - name: certs
            secret:
              secretName: etcd-certs
- apiVersion: batch/v1
  kind: Job
  metadata:
    labels:
      app.kubernetes.io/component: etcd
      app.kubernetes.io/instance: kamaji-etcd
