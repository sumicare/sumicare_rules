- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app.kubernetes.io/component: kubeconfig-generator
      app.kubernetes.io/instance: kamaji-kubeconfig-generator
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: kamaji-kubeconfig-generator
      app.kubernetes.io/part-of: kamaji-kubeconfig-generator
      app.kubernetes.io/version: 26.7.5-edge
    name: kamaji-kubeconfig-generator
    namespace: kamaji-system
  spec:
    minReadySeconds: 0
    progressDeadlineSeconds: 600
    replicas: 2
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        cdk8s.io/metadata.addr: kamaji-kubeconfig-generator-deployment-c879acd0
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        labels:
          app.kubernetes.io/component: kubeconfig-generator
          app.kubernetes.io/instance: kamaji-kubeconfig-generator
          app.kubernetes.io/name: kamaji-kubeconfig-generator
          cdk8s.io/metadata.addr: kamaji-kubeconfig-generator-deployment-c879acd0
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: eks.amazonaws.com/compute-type
                      operator: NotIn
                      values:
                        - fargate
                        - auto
                    - key: cloud.google.com/compute-class
                      operator: DoesNotExist
                    - key: kubernetes.azure.com/cluster-autoscaler-mode
                      operator: NotIn
                      values:
                        - automatic
                    - key: cloud.google.com/gke-spot
                      operator: NotIn
                      values:
                        - "true"
                    - key: kubernetes.azure.com/scalesetpriority
                      operator: NotIn
                      values:
                        - spot
                    - key: lifecycle
                      operator: NotIn
                      values:
                        - Spot
                        - spot
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cdk8s.io/metadata.addr: kamaji-kubeconfig-generator-deployment-c879acd0
                  namespaces:
                    - kamaji-system
                  topologyKey: kubernetes.io/hostname
                weight: 100
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cdk8s.io/metadata.addr: kamaji-kubeconfig-generator-deployment-c879acd0
                  namespaces:
                    - kamaji-system
                  topologyKey: topology.kubernetes.io/zone
                weight: 50
        automountServiceAccountToken: false
        containers:
          - args:
              - kubeconfig-generator
              - --metrics-bind-address=:8090
              - --health-probe-bind-address=:8091
              - --leader-elect=true
              - --controller-reconcile-timeout=30s
              - --cache-resync-period=10h
              - --certificate-expiration-deadline=24h
            image: clastix/kamaji:26.7.5-edge
            imagePullPolicy: Always
            name: controller
            ports:
              - containerPort: 8091
                name: healthcheck
                protocol: TCP
            resources:
              limits:
                cpu: 400m
                memory: 1024Mi
              requests:
                cpu: 200m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile:
                type: RuntimeDefault
        dnsPolicy: ClusterFirst
        hostNetwork: false
        restartPolicy: Always
        securityContext:
          fsGroup: 65532
          fsGroupChangePolicy: Always
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        setHostnameAsFQDN: false
        shareProcessNamespace: false
        terminationGracePeriodSeconds: 30
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: kubeconfig-generator
                app.kubernetes.io/instance: kamaji-kubeconfig-generator
                app.kubernetes.io/name: kamaji-kubeconfig-generator
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: kubeconfig-generator
                app.kubernetes.io/instance: kamaji-kubeconfig-generator
                app.kubernetes.io/name: kamaji-kubeconfig-generator
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
