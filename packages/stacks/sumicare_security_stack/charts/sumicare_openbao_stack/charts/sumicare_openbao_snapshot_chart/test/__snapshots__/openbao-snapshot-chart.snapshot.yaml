- apiVersion: v1
  data:
    BAO_ADDR: https://openbao.vault-system.svc:8200
    BAO_AUTH_PATH: kubernetes
    BAO_ROLE: bao-raft-snapshot
    S3_BUCKET: openbao-snapshots
    S3_EXPIRE_DAYS: ""
    S3_HOST: https://s3.example.com
    S3_URI: s3://openbao-snapshots
  immutable: false
  kind: ConfigMap
  metadata:
    labels:
      app.kubernetes.io/component: snapshot
      app.kubernetes.io/instance: openbao
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: openbao
      app.kubernetes.io/part-of: openbao
      app.kubernetes.io/version: 0.3.0
    name: openbao-snapshot
    namespace: vault-system
- apiVersion: batch/v1
  kind: CronJob
  metadata:
    labels:
      app.kubernetes.io/component: snapshot
      app.kubernetes.io/instance: openbao
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: openbao
      app.kubernetes.io/part-of: openbao
      app.kubernetes.io/version: 0.3.0
    name: openbao-snapshot
    namespace: vault-system
  spec:
    concurrencyPolicy: Forbid
    failedJobsHistoryLimit: 5
    jobTemplate:
      spec:
        template:
          metadata:
            labels:
              app.kubernetes.io/component: snapshot
              app.kubernetes.io/instance: openbao
              app.kubernetes.io/name: openbao
              cdk8s.io/metadata.addr: openbao-snapshot-chart-snapshot-cronjob-cronjob-c82a5573
          spec:
            automountServiceAccountToken: true
            containers:
              - env:
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        key: AWS_SECRET_ACCESS_KEY
                        name: bao-snapshot-credentials
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        key: AWS_ACCESS_KEY_ID
                        name: bao-snapshot-credentials
                envFrom:
                  - configMapRef:
                      name: openbao-snapshot
                image: ghcr.io/openbao/openbao-snapshot-agent:v0.3.0
                imagePullPolicy: IfNotPresent
                name: bao-snapshot
                resources:
                  limits:
                    cpu: 100m
                    memory: 256Mi
                  requests:
                    cpu: 50m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  privileged: false
                  readOnlyRootFilesystem: true
                  runAsGroup: 1000
                  runAsNonRoot: true
                  runAsUser: 100
                  seccompProfile:
                    type: RuntimeDefault
                volumeMounts:
                  - mountPath: /bao-snapshots
                    name: snapshot-dir
            dnsPolicy: ClusterFirst
            hostNetwork: false
            restartPolicy: Never
            securityContext:
              fsGroupChangePolicy: Always
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: openbao-snapshot
            setHostnameAsFQDN: false
            shareProcessNamespace: false
            terminationGracePeriodSeconds: 30
            volumes:
              - emptyDir: {}
                name: snapshot-dir
    startingDeadlineSeconds: 10
    successfulJobsHistoryLimit: 3
    suspend: false
