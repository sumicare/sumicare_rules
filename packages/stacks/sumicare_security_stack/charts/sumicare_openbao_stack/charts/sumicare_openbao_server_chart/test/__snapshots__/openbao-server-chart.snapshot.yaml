      app.kubernetes.io/name: openbao
      app.kubernetes.io/part-of: openbao
      app.kubernetes.io/version: 2.6.1
    name: openbao
    namespace: vault-system
  spec:
    externalIPs: []
    ports:
      - name: api
        port: 8200
        targetPort: 8200
      - name: cluster
        port: 8201
