- apiVersion: apps/v1
  kind: DaemonSet
  metadata:
    labels:
      app.kubernetes.io/component: csi
      app.kubernetes.io/instance: openbao
      app.kubernetes.io/managed-by: sumicare_rules
      app.kubernetes.io/name: openbao
      app.kubernetes.io/part-of: openbao
      app.kubernetes.io/version: 2.0.2
    name: openbao-csi-provider
    namespace: vault-system
  spec:
    minReadySeconds: 0
    selector:
      matchLabels:
        cdk8s.io/metadata.addr: openbao-csi-chart-csi-daemonset-ds-c825b78d
    template:
      metadata:
        labels:
          app.kubernetes.io/component: csi
          app.kubernetes.io/instance: openbao
          app.kubernetes.io/name: openbao
          cdk8s.io/metadata.addr: openbao-csi-chart-csi-daemonset-ds-c825b78d
      spec:
        automountServiceAccountToken: false
        containers:
          - args:
              - --endpoint=/provider/openbao.sock
              - --debug=false
              - --hmac-secret-name=openbao-csi-provider-hmac-key
              - --openbao-mount=kubernetes
              - --cache-size=1000
            env:
              - name: VAULT_ADDR
                value: https://openbao.vault-system.svc:8200
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            image: quay.io/openbao/openbao-csi-provider:v2.0.2
            imagePullPolicy: IfNotPresent
            livenessProbe:
              failureThreshold: 2
              httpGet:
                path: /health/ready
                port: 8080
                scheme: HTTP
              initialDelaySeconds: 5
              periodSeconds: 5
              successThreshold: 1
              timeoutSeconds: 3
            name: openbao-csi-provider
            ports:
              - containerPort: 8080
                name: metrics
                protocol: TCP
            readinessProbe:
              failureThreshold: 2
              httpGet:
                path: /health/ready
                port: 8080
                scheme: HTTP
              initialDelaySeconds: 5
              periodSeconds: 5
              successThreshold: 1
              timeoutSeconds: 3
            resources:
              limits:
                cpu: 100m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - mountPath: /provider
                name: providervol
        dnsPolicy: ClusterFirst
        hostNetwork: false
        restartPolicy: Always
        securityContext:
          fsGroupChangePolicy: Always
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        serviceAccountName: openbao-csi-provider
        setHostnameAsFQDN: false
        shareProcessNamespace: false
        terminationGracePeriodSeconds: 30
        volumes:
          - hostPath:
              path: /etc/kubernetes/secrets-store-csi-providers
              type: DirectoryOrCreate
            name: providervol
    updateStrategy:
      type: RollingUpdate
