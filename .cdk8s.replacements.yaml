# Per-file Helm template replacements.
# `replace` maps pattern → replacement (literal strings only).
# `template` wraps the content with a CRD envelope (for Kamaji-style specs).

crd-kamaji-datastores.yaml:
  replace:
    "{{ .Values.kamajiService }}": kamaji-webhook-service
    "{{ .Values.kamajiNamespace }}": kamaji-system
  template: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: datastores.kamaji.clastix.io
    spec:
      {{ content }}

crd-kamaji-kubeconfiggenerators.yaml:
  replace:
    "{{ .Values.kamajiService }}": kamaji-webhook-service
    "{{ .Values.kamajiNamespace }}": kamaji-system
  template: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: kubeconfiggenerators.kamaji.clastix.io
    spec:
      {{ content }}

crd-kamaji-tenantcontrolplanes.yaml:
  replace:
    "{{ .Values.kamajiService }}": kamaji-webhook-service
    "{{ .Values.kamajiNamespace }}": kamaji-system
  template: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: tenantcontrolplanes.kamaji.clastix.io
    spec:
      {{ content }}

crd-theia-appdefinitions.yaml:
  replace:
    "{{ .Release.Namespace }}": theia-cloud

crd-theia-sessions.yaml:
  replace:
    "{{ .Release.Namespace }}": theia-cloud

crd-theia-workspaces.yaml:
  replace:
    "{{ .Release.Namespace }}": theia-cloud
