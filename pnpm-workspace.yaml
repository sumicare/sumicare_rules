packages:
  - "packages/libs/sumicare_*"
  - "packages/services/sumicare_*"
  - "packages/stacks/sumicare_*"
  - "packages/stacks/sumicare_*/charts/sumicare_*"
  - "packages/stacks/sumicare_*/charts/sumicare_*/charts/sumicare_*"

linkWorkspacePackages: true

allowBuilds:
  core-js: false
  esbuild: false

onlyBuiltDependencies:
