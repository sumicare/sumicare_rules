  fast-uri@>=3.0.0 <3.1.4: ^3.1.4
  follow-redirects@<=1.15.11: ^1.15.12
  prismjs@<1.30.0: ^1.30.0
  react-router-dom@<7.18.1: 7.18.1
  react-router@<8.3.0: 8.3.0
  undici@<6.27.0: ^6.27.0
  valibot: "^1.4.2"
  glob: "^13.0.6"

minimumReleaseAgeExclude:
  - brace-expansion@5.0.8
  - fast-uri@3.1.4
  - jsii-rosetta@5.9.56
  - react-router@8.3.0
  - follow-redirects@1.15.12

minimumReleaseAge: 20160
